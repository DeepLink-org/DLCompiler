name: DLCompiler format ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    if: github.repository == 'DeepLink-org/DLCompiler'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 16
    - name: Collect changed files
      uses: tj-actions/changed-files@v40
      id: changed-files
      with:
        files: '**/*.md'
        separator: ','
    - name: MarkdownLint
      if: steps.changed-files.outputs.any_changed == 'true'
      uses: DavidAnson/markdownlint-cli2-action@v14
      with:
        globs: ${{ steps.changed-files.outputs.all_changed_files }}
        separator: ','

  clang-format:
    needs: markdownlint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-15

      - name: Check changed files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            diff_range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ] && \
               [ -n "${{ github.event.before }}" ] && \
               [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            diff_range="${{ github.event.before }}..${{ github.sha }}"
          else
            default_branch="${{ github.event.repository.default_branch }}"
            git fetch --no-tags --prune origin \
              "+refs/heads/${default_branch}:refs/remotes/origin/${default_branch}"
            diff_range="origin/${default_branch}...HEAD"
          fi

          echo "Checking files changed in ${diff_range}"
          git diff --diff-filter=d --name-only \
            "${diff_range}" -- \
            > all_changed_files.txt

          awk '/\.(cc|cpp|cxx|h|hpp)$/ && $0 !~ /^third_party\// { print }' \
            all_changed_files.txt \
            > changed_files.txt

          if [ ! -s changed_files.txt ]; then
            echo "No C/C++ files changed"
            exit 0
          fi

          xargs -r -a changed_files.txt clang-format-15 --dry-run -Werror

  python-black:
    needs: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 确保能获取到 main 分支的历史
      - name: Check formatting for PR files
        run: |
          bash scripts/ci_python_black.sh
